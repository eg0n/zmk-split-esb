# The Corne's features, as in miryoku_zmk's build-acb-corne workflow, which
# builds with this file too. The screen comes from corne_gem.conf (the
# default) or corne_debug.conf: see CORNE_SCREEN in scripts/build.sh.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SPLIT_ESB=y

# The radio belongs to ESB alone.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
