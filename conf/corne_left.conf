# Settings from miryoku_zmk's build-acb-corne workflow
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ESB debug build: our screen replaces the stock nice!view one
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_DEBUG_SCREEN=y

# Phase 1: no BLE split, so the central isn't scanning for the right half
# while the hosted receiver listens. BLE to hosts stays on.
CONFIG_ZMK_SPLIT_BLE=n
