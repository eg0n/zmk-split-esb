# ESB central with BLE (multi-profile) to hosts. BLE split stays built in for
# ZMK's per-peripheral state but is never enabled. The settings in
# miryoku_zmk's config/totem_dongle.conf still apply on top of these.
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_NETWORK="totem"

# USB-powered, so always listen continuously: no extra latency on the first
# key after idle.
CONFIG_ZMK_SPLIT_ESB_PRX_LOW_POWER_IDLE=n
