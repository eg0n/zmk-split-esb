# KeyBeacon over USB for the Mac's menu-bar widget (eg0n/zmk-keybeacon, branch
# feat/dongle-usb), on top of totem_dongle.conf. KeyBeacon's USB interface is the
# second HID device. WPM and the host's Caps Lock LED feed its Activity payload.
CONFIG_ZMK_KEYBEACON=y
CONFIG_ZMK_KEYBEACON_SPLIT_DONGLE=y
CONFIG_ZMK_KEYBEACON_USB=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_WPM=y
CONFIG_ZMK_HID_INDICATORS=y
